<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veri Giriş | Albayrak Grubu</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="dashboard">
      <header class="topbar card">
        <div class="brand">
          <img src="logo.svg" alt="Albayrak Grubu" class="brand-logo" />
          <div>
            <p class="eyebrow">Albayrak Grubu</p>
            <h1>Haftalık Veri Giriş Ekranı</h1>
            <p class="subtitle">Elle girilen sayılar dashboard üzerinde otomatik gösterilir.</p>
          </div>
        </div>
        <a class="btn" href="index.html">Dashboard'a Dön</a>
      </header>

      <article class="card section-card">
        <div class="section-head">
          <h2>Beton Veri Girişi</h2>
          <span class="muted">Üretim, sefer, tahsilat ve plan değerleri</span>
        </div>
        <div id="concreteInputGrid" class="settings-grid"></div>
      </article>

      <article class="card section-card">
        <div class="section-head">
          <h2>Agrega Veri Girişi</h2>
          <span class="muted">Üretim, sevk ve kamyon sefer sayıları</span>
        </div>
        <div id="aggregateInputGrid" class="settings-grid"></div>
      </article>

      <article class="card section-card">
        <button class="btn" id="saveInputBtn">Kaydet</button>
        <button class="btn ghost" id="resetInputBtn">Varsayılana Dön</button>
        <p class="muted" id="inputStatus"></p>
      </article>
    </main>

    <script>
      const STORAGE_KEY = "albayrak_manual_data_v1";
      const base = {
        concrete: {
          finike: { production_m3: 2693.5, trip_count: 291, collection_tl: 1268925, next_week_plan_m3: 1343 },
          kas: { production_m3: 1024, trip_count: 143, collection_tl: 2510005, next_week_plan_m3: 500 },
          kalkan: { production_m3: 1110, trip_count: 157, collection_tl: 2500000, next_week_plan_m3: 650 },
          antalya: { production_m3: 580, trip_count: 53, collection_tl: 40000, next_week_plan_m3: 500 }
        },
        aggregate: {
          finike: { production_ton: 15750, dispatch_ton: 14550, truck_trip_count: 622 },
          kas: { production_ton: 5118.62, dispatch_ton: 2464.87, truck_trip_count: 242 }
        }
      };

      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null") || base;

      function renderGrid(elId, dataset, fields) {
        const el = document.getElementById(elId);
        el.innerHTML = Object.entries(dataset).map(([key, obj]) => `
          <div class="setting-card">
            <h4>${key.toUpperCase()}</h4>
            ${fields.map((f) => `<label class='setting-row'>${f}<input type='number' step='0.01' data-group='${elId}' data-key='${key}' data-field='${f}' value='${obj[f] ?? 0}' /></label>`).join('')}
          </div>
        `).join("");
      }

      renderGrid("concreteInputGrid", saved.concrete, ["production_m3", "trip_count", "collection_tl", "next_week_plan_m3"]);
      renderGrid("aggregateInputGrid", saved.aggregate, ["production_ton", "dispatch_ton", "truck_trip_count"]);

      function collect() {
        const out = { concrete: {}, aggregate: {} };
        document.querySelectorAll("input[data-group='concreteInputGrid']").forEach((i) => {
          out.concrete[i.dataset.key] ||= {};
          out.concrete[i.dataset.key][i.dataset.field] = Number(i.value || 0);
        });
        document.querySelectorAll("input[data-group='aggregateInputGrid']").forEach((i) => {
          out.aggregate[i.dataset.key] ||= {};
          out.aggregate[i.dataset.key][i.dataset.field] = Number(i.value || 0);
        });
        return out;
      }

      document.getElementById("saveInputBtn").onclick = () => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(collect()));
        document.getElementById("inputStatus").textContent = "Kaydedildi. Dashboard sayfasına döndüğünüzde yeni değerler kullanılacaktır.";
      };

      document.getElementById("resetInputBtn").onclick = () => {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
      };
    </script>
  </body>
</html>
